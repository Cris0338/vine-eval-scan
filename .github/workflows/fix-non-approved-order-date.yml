name: Fix Non approuve order dates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-non-approved-order-date.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch order date fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('amazon-vine-eval-scan.user.js')
          s = p.read_text(encoding='utf-8')
          old_version = '// @version      3.4.8'
          if old_version not in s:
              raise SystemExit('Expected version 3.4.8 not found')
          s = s.replace(old_version, '// @version      3.4.9', 1)
          anchor = '  function formatFR(iso) {\n    return iso ? new Date(iso).toLocaleString("fr-FR") : "—";\n  }\n'
          helper = '  function formatOrderDateFromTs(ts) {\n    const n = Number(ts);\n    if (!Number.isFinite(n)) {\n      return "";\n    }\n    const d = new Date(n);\n    return Number.isNaN(d.getTime())\n      ? ""\n      : d.toLocaleDateString("fr-FR", {\n          day: "2-digit",\n          month: "2-digit",\n          year: "numeric",\n        });\n  }\n'
          if anchor not in s:
              raise SystemExit('formatFR anchor not found')
          s = s.replace(anchor, anchor + helper, 1)
          old_date = '      orderDateText: (tsCell?.textContent || "").replace(/\\s+/g, " ").trim(),'
          new_date = '      orderDateText:\n        (tsCell?.textContent || "").replace(/\\s+/g, " ").trim() ||\n        formatOrderDateFromTs(ts),'
          if old_date not in s:
              raise SystemExit('extractProductMeta orderDateText anchor not found')
          s = s.replace(old_date, new_date, 1)
          check_anchor = '    const checkButton = (r) => {'
          order_helper = '    const orderDate = (r) =>\n      escapeHtml(\n        r.orderDateText || formatOrderDateFromTs(r.orderTs) || "—",\n      );\n'
          if check_anchor not in s:
              raise SystemExit('checkButton anchor not found')
          s = s.replace(check_anchor, order_helper + check_anchor, 1)
          old_render = '${escapeHtml(r.orderDateText || "—")}'
          count = s.count(old_render)
          if count != 2:
              raise SystemExit(f'Expected 2 order date render occurrences, found {count}')
          s = s.replace(old_render, '${orderDate(r)}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Format and verify
        run: |
          npx --yes prettier@3.3.3 --write amazon-vine-eval-scan.user.js
          node --check amazon-vine-eval-scan.user.js
          npx --yes eslint@8 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022}' --rule 'curly:["error","all"]' amazon-vine-eval-scan.user.js

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-non-approved-order-date.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon-vine-eval-scan.user.js .github/workflows/fix-non-approved-order-date.yml
          git commit -m "Fix Non approuve order date display"
          git push origin HEAD:main
