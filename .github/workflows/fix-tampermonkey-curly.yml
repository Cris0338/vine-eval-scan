name: Fix Tampermonkey curly warnings

on:
  push:
    branches:
      - feature/non-approuve-workflow

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[curly-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/non-approuve-workflow
          fetch-depth: 0

      - name: Fix curly warnings everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('amazon-vine-eval-scan.user.js')
          s = p.read_text(encoding='utf-8')
          old = '// @version      3.4.5-dev'
          new = '// @version      3.4.6-dev'
          if old not in s:
              raise SystemExit('Expected version not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          npx --yes eslint@8 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022}' --rule 'curly:["error","all"]' --fix amazon-vine-eval-scan.user.js
          npx --yes prettier@3.3.3 --write amazon-vine-eval-scan.user.js

      - name: Verify JavaScript syntax
        run: node --check amazon-vine-eval-scan.user.js

      - name: Verify no curly warnings remain
        run: npx --yes eslint@8 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022}' --rule 'curly:["error","all"]' amazon-vine-eval-scan.user.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon-vine-eval-scan.user.js
          git commit -m "Fix Tampermonkey curly lint warnings [curly-done]"
          git push origin HEAD:feature/non-approuve-workflow
