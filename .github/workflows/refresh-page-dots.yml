name: Refresh page with animated dots

on:
  push:
    branches:
      - feature/non-approuve-workflow

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[refresh-dots-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/non-approuve-workflow
          fetch-depth: 0

      - name: Patch Refresh status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('amazon-vine-eval-scan.user.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('// @version      3.4.6-dev', '// @version      3.4.7-dev'),
              ('.vineEvalStatus{font-size:12px;font-weight:700;opacity:.95}', '.vineEvalStatus{font-size:12px;font-weight:700;opacity:.95}.vineRefreshDots{display:inline-flex;margin-left:2px}.vineRefreshDots span{display:inline-block;animation:vineRefreshDot 1.2s infinite;opacity:.2}.vineRefreshDots span:nth-child(2){animation-delay:.2s}.vineRefreshDots span:nth-child(3){animation-delay:.4s}@keyframes vineRefreshDot{0%,20%,100%{opacity:.2}50%{opacity:1}}'),
              ('if (status) {\n          status.textContent = "Refresh…";\n        }\n        let doc = page === 1 ? document : null;', 'if (status) {\n          status.innerHTML = `Refresh page ${page} <span class="vineRefreshDots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>`;\n        }\n        let doc = page === 1 ? document : null;'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected string not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Format and verify
        run: |
          npx --yes prettier@3.3.3 --write amazon-vine-eval-scan.user.js
          node --check amazon-vine-eval-scan.user.js
          npx --yes eslint@8 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022}' --rule 'curly:["error","all"]' amazon-vine-eval-scan.user.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon-vine-eval-scan.user.js
          git commit -m "Show Refresh page with animated dots [refresh-dots-done]"
          git push origin HEAD:feature/non-approuve-workflow
